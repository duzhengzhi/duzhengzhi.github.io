<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>写作后台</title>
  <link rel="stylesheet" href="/assets/style.css?v=16" />
  <link rel="stylesheet" href="/assets/article.css?v=16" />
  <link rel="icon" href="/assets/avatar.jpg" />
</head>
<body>
  <nav class="nav"><div class="nav-inner">
    <a class="logo" href="/"><span class="logo-title">写作后台</span></a>
    <div class="nav-right">
      <button type="button" class="nav-text" id="logout" hidden>退出</button>
      <a class="nav-text" href="/">看博客</a>
    </div>
  </div></nav>

  <main class="wrap article">
    <section id="gate" class="panel" style="padding:28px">
      <div class="panel-head"><h2>使用 GitHub 登录</h2></div>
      <p class="meta" style="padding:0 16px 8px">只有仓库作者能发布。访客看不到这一页的入口。</p>
      <ol class="prose" style="padding:0 20px 8px">
        <li>打开 <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">GitHub Fine-grained Token</a></li>
        <li>只授权仓库 <b>duzhengzhi/duzhengzhi.github.io</b> 的 Contents 读写</li>
        <li>粘贴令牌后进入后台</li>
      </ol>
      <div style="padding:8px 16px 20px">
        <input id="token" type="password" placeholder="github_pat_ 或 ghp_" style="width:100%;height:44px;border-radius:14px;border:1px solid rgba(0,0,0,.1);padding:0 14px" />
        <p style="margin:14px 0 0"><button type="button" class="pill" id="login" style="border:0;cursor:pointer">登录并进入</button></p>
        <p id="gate-msg" class="meta"></p>
      </div>
    </section>

    <section id="desk" hidden>
      <p class="meta" id="who"></p>
      <div id="list" class="posts"></div>
      <h2 id="form-title">写新文章</h2>
      <input id="slug" placeholder="链接名，如 pws-architecture" style="width:100%;height:40px;border-radius:12px;border:1px solid rgba(0,0,0,.1);padding:0 12px;margin:8px 0" />
      <input id="title" placeholder="标题" style="width:100%;height:40px;border-radius:12px;border:1px solid rgba(0,0,0,.1);padding:0 12px;margin:8px 0" />
      <input id="date" placeholder="日期 2026-09-10" style="width:100%;height:40px;border-radius:12px;border:1px solid rgba(0,0,0,.1);padding:0 12px;margin:8px 0" />
      <input id="summary" placeholder="列表摘要" style="width:100%;height:40px;border-radius:12px;border:1px solid rgba(0,0,0,.1);padding:0 12px;margin:8px 0" />
      <textarea id="body" placeholder="正文，可用 p / h2 / ul" style="width:100%;min-height:260px;border-radius:16px;border:1px solid rgba(0,0,0,.1);padding:12px;margin:8px 0;font:16px/1.6 -apple-system,sans-serif"></textarea>
      <p>
        <button type="button" class="pill" id="save" style="border:0;cursor:pointer">发布</button>
        <button type="button" class="pill" id="reset" style="border:0;cursor:pointer;background:#eee;color:#333">清空</button>
      </p>
      <p id="msg" class="meta"></p>
    </section>
  </main>
  <script src="/assets/studio.js?v=16"></script>
</body>
</html>
